services:
  buzzhub-dev:
    image: oven/bun:1.2-alpine
    working_dir: /app
    volumes:
      - .:/app
      - buzzhub_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "${BUZZHUB_PORT:-8080}:8080"
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0"

volumes:
  buzzhub_node_modules:
